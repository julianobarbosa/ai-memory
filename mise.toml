# mise configuration for ai-memory repository
# Docs: https://mise.jdx.dev/configuration.html

[tools]
just = "latest"

[tasks.landing-msg]
description = "Show sync reminder on directory enter"
quiet = true
run = '''
printf "\n\033[1;36m╭─────────────────────────────────────────────────────────────╮\033[0m\n"
printf "\033[1;36m│\033[0m \033[1;32m⚡ ai-memory workspace\033[0m                                     \033[1;36m│\033[0m\n"
printf "\033[1;36m│\033[0m To sync \033[1mmain\033[0m from upstream:                                  \033[1;36m│\033[0m\n"
printf "\033[1;36m│\033[0m   👉 \033[1;33mjust sync\033[0m       - Safe sync (tree check + origin + up) \033[1;36m│\033[0m\n"
printf "\033[1;36m│\033[0m   👉 \033[1;33mjust sync-push\033[0m  - Sync and push to origin              \033[1;36m│\033[0m\n"
printf "\033[1;36m│\033[0m   👉 \033[1;33mjust status\033[0m     - Check local vs origin vs upstream    \033[1;36m│\033[0m\n"
printf "\033[1;36m╰─────────────────────────────────────────────────────────────╯\033[0m\n"

BEHIND_UPSTREAM=$(git rev-list --count HEAD..upstream/main 2>/dev/null || echo 0)
BEHIND_ORIGIN=$(git rev-list --count HEAD..origin/main 2>/dev/null || echo 0)

if [ "$BEHIND_UPSTREAM" -gt 0 ]; then
    printf "\033[1;33m⚠️  Notice: Local branch is behind upstream/main by %s commit(s).\033[0m\n" "$BEHIND_UPSTREAM"
    printf "   Run \033[1mjust sync\033[0m to bring changes in.\n\n"
elif [ "$BEHIND_ORIGIN" -gt 0 ]; then
    printf "\033[1;33m⚠️  Notice: Local branch is behind origin/main by %s commit(s).\033[0m\n" "$BEHIND_ORIGIN"
    printf "   Run \033[1mjust sync\033[0m to fast-forward.\n\n"
else
    printf "\n"
fi
'''

[hooks]
enter = { task = "landing-msg" }
